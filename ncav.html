<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>A/B股烟蒂股 NCAV 筛选器</title>
<style>
  :root{--bg:#0f1419;--panel:#1a2129;--line:#2a3441;--txt:#d5dde5;--dim:#7a8a99;--accent:#3b82f6;--up:#22c55e;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font-family:"SF Mono","Cascadia Code",Consolas,"Microsoft YaHei",monospace;font-size:13px;padding:20px}
  h1{font-size:16px;font-weight:600;color:#e6edf3;margin-bottom:4px}
  .sub{color:var(--dim);font-size:11px;margin-bottom:14px}
  .bar{display:flex;align-items:center;gap:14px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 16px;margin-bottom:14px;flex-wrap:wrap}
  .stat{font-size:11px;color:var(--dim)}.stat b{color:var(--txt);font-size:14px;margin-left:6px}
  .rate-box{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 16px;margin-bottom:14px;font-size:11px;color:var(--dim);flex-wrap:wrap}
  .rate-box .rate-item{color:var(--txt)}
  .rate-box .rate-item b{color:var(--accent);font-size:13px;margin:0 4px}
  .rate-box .rate-time{color:var(--dim);font-size:10px;margin-left:auto}
  .progress{flex:1;min-width:200px;height:4px;background:#232b36;border-radius:2px;overflow:hidden}
  .progress>i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
  button{background:var(--accent);color:#fff;border:none;border-radius:6px;padding:7px 18px;font:inherit;font-size:12px;cursor:pointer}
  button:hover{filter:brightness(1.1)}button:disabled{background:#3a4656;cursor:not-allowed}
  #tblWrap{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:auto;max-height:70vh}
  table{border-collapse:collapse;width:100%;font-size:12px}
  thead th{position:sticky;top:0;background:#212b36;color:#9fb0c0;font-weight:500;text-align:right;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;z-index:1}
  thead th:first-child,tbody td:first-child,thead th:nth-child(2),tbody td:nth-child(2),thead th:nth-child(3),tbody td:nth-child(3){text-align:left}
  tbody td{padding:7px 10px;border-bottom:1px solid #1e2732;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
  tbody tr:nth-child(even){background:#171e26}
  tbody tr:hover{background:#202b37}
  .num-null{color:#4a5568}
  .tag-low{color:var(--up)}
  .tag-b{color:#f59e0b}
  .log{margin-top:10px;color:var(--dim);font-size:11px;line-height:1.7;max-height:130px;overflow:auto;word-break:break-all}
  .err{color:#ef4444}
</style>
</head>
<body>
<h1>A/B股烟蒂股 NCAV 筛选器</h1>
<div class="sub">口径：NCAV = 流动资产合计 − 负债合计 − 少数股东权益 − 其他权益工具（含永续债/优先股，类债属性）；筛选条件 NCAV &gt; 总市值；按 市值/NCAV 升序 · 覆盖沪深A股+沪深B股（B股市值已按实时汇率换算人民币）· 已排除退市/停牌股 · 仅供研究</div>

<!-- 汇率显示面板 -->
<div class="rate-box" id="rateBox">
  <span style="color:var(--dim)">当前计算汇率（实时获取）：</span>
  <span class="rate-item">美元/CNY = <b id="rateUsd">获取中…</b></span>
  <span class="rate-item">港币/CNY = <b id="rateHkd">获取中…</b></span>
  <span class="rate-time" id="rateTime">—</span>
</div>

<div class="bar">
  <button id="btnRefresh">刷新数据</button>
  <span class="stat">A股总数<b id="sTotal">—</b></span>
  <span class="stat">B股总数<b id="sBTotal">—</b></span>
  <span class="stat">破净粗筛<b id="sCand">—</b></span>
  <span class="stat">批量覆盖<b id="sCover">—</b></span>
  <span class="stat">最终入选<b id="sFinal">—</b></span>
  <span class="stat">下次自动刷新<b id="sNext">—</b></span>
  <div class="progress"><i id="pgBar"></i></div>
</div>

<div id="tblWrap"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
<div class="log" id="log"></div>

<script>
/* ================= 工具函数 ================= */
const $=id=>document.getElementById(id);
const log=(m,e)=>{const d=document.createElement('div');d.textContent='['+new Date().toLocaleTimeString()+'] '+m;if(e)d.className='err';$('log').appendChild(d);$('log').scrollTop=1e9;};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ================= 安全存储 ================= */
const memoryStorage={};
const safeStorage={
  getItem:k=>{try{return localStorage.getItem(k)}catch(e){return memoryStorage[k]||null}},
  setItem:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){memoryStorage[k]=v}}
};

const cleanNum=v=>{
  if(v===null||v===undefined||v==='')return 0;
  if(typeof v==='number')return v;
  return parseFloat(String(v).replace(/,/g,''))||0;
};

const isBShare=code=>{
  const c=String(code);
  return c.startsWith('900')||c.startsWith('200');
};

/* ================= 域名池 ================= */
const PUSH2_HOSTS=[
  {host:'29.push2.eastmoney.com', label:'29实时', fails:0, cooldownUntil:0},
  {host:'79.push2.eastmoney.com', label:'79实时', fails:0, cooldownUntil:0},
  {host:'91.push2.eastmoney.com', label:'91实时', fails:0, cooldownUntil:0},
  {host:'push2delay.eastmoney.com', label:'延迟镜像', fails:0, cooldownUntil:0},
  {host:'82.push2.eastmoney.com', label:'82备用', fails:0, cooldownUntil:0},
  {host:'17.push2.eastmoney.com', label:'17备用', fails:0, cooldownUntil:0},
];

function getAvailableHost(){
  const now=Date.now();
  for(const h of PUSH2_HOSTS){
    if(now<h.cooldownUntil)continue;
    return h;
  }
  PUSH2_HOSTS.sort((a,b)=>a.cooldownUntil-b.cooldownUntil);
  return PUSH2_HOSTS[0];
}

function markHost(h,success){
  if(success){
    h.fails=0;h.cooldownUntil=0;
  }else{
    h.fails++;
    if(h.fails>=2){
      h.cooldownUntil=Date.now()+30000;
      h.fails=0;
      log('节点 '+h.label+' 连续失败，冷却30秒');
    }
  }
}

let _cb=0;
async function jsonpPush2(path){
  for(let hostAttempt=0;hostAttempt<PUSH2_HOSTS.length*3;hostAttempt++){
    const h=getAvailableHost();
    const url='https://'+h.host+path;
    try{
      const result=await jsonpSingle(url,h.label);
      markHost(h,true);
      return result;
    }catch(e){
      markHost(h,false);
      if(hostAttempt<PUSH2_HOSTS.length*3-1){
        await sleep(800);
      }
    }
  }
  throw new Error('所有push2节点均不可用，请稍后重试');
}

function jsonpSingle(url,label){
  return new Promise((res,rej)=>{
    const name='__emcb_'+(++_cb)+'_'+Date.now();
    const s=document.createElement('script');
    const timer=setTimeout(()=>{cleanup();rej(new Error(label+'超时'))},15000);
    function cleanup(){clearTimeout(timer);delete window[name];if(s.parentNode)s.parentNode.removeChild(s);}
    window[name]=d=>{cleanup();res(d);};
    s.onerror=()=>{cleanup();rej(new Error(label+'网络失败'))};
    s.src=url+(url.includes('?')?'&':'?')+'cb='+name;
    document.head.appendChild(s);
  });
}

async function jsonpDC(url,retries=3){
  for(let i=0;i<retries;i++){
    try{
      return await jsonpSingleDC(url);
    }catch(e){
      if(i<retries-1)await sleep(1000);
    }
  }
  throw new Error('datacenter接口失败: '+url.slice(0,80)+'…');
}

function jsonpSingleDC(url){
  return new Promise((res,rej)=>{
    const name='__emcb_'+(++_cb)+'_'+Date.now();
    const s=document.createElement('script');
    const timer=setTimeout(()=>{cleanup();rej(new Error('DC超时'))},20000);
    function cleanup(){clearTimeout(timer);delete window[name];if(s.parentNode)s.parentNode.removeChild(s);}
    window[name]=d=>{cleanup();res(d);};
    s.onerror=()=>{cleanup();rej(new Error('DC网络失败'))};
    s.src=url+(url.includes('?')?'&':'?')+'callback='+name;
    document.head.appendChild(s);
  });
}

async function pool(tasks,limit,onOne){
  const ret=[];let i=0,done=0;
  const workers=Array(Math.min(limit,tasks.length)).fill(0).map(async()=>{
    while(i<tasks.length){const k=i++;
      try{ret[k]=await tasks[k]();}catch(e){ret[k]=null;}
      done++;onOne&&onOne(done,tasks.length);}
  });
  await Promise.all(workers);return ret;
}

const yi=v=>v==null||isNaN(v)?null:(v/1e8);
const codeOf=(code,mkt)=>{
  if(mkt===1)return code+'.SH';
  if(code.startsWith('8')||code.startsWith('4')||code.startsWith('92'))return code+'.BJ';
  return code+'.SZ';
};

/* ================= 汇率获取（修正版：使用正确的外汇列表接口） ================= */
async function fetchExchangeRate(){
  let usRate=0;let hkRate=0;let isDefault=false;
  
  /* 默认值（仅在完全无法获取实时汇率时使用） */
  let defaultUs=7.20;let defaultHk=0.92;
  
  try{
    /* 使用正确的外汇列表接口获取实时汇率 */
    /* fs=m:119,m:120,m:133 覆盖所有外汇市场分类 */
    const forexPath='/api/qt/clist/get?pn=1&pz=200&po=1&np=1'+
      '&ut=bd1d9ddb04089700cf9c27f6f7426281&fltt=2&invt=2&fid=f12'+
      '&fs=m:119,m:120,m:133'+
      '&fields=f2,f12,f14';
    
    const r=await jsonpPush2(forexPath);
    const list=(r&&r.data&&r.data.diff)||[];
    
    if(!Array.isArray(list)&&typeof list==='object'){
      /* 兼容对象格式 */
      list=Object.values(list);
    }
    
    /* 在返回的外汇列表中查找 USDCNH 和 HKDCNH */
    for(const item of list){
      const code=item.f12;
      const price=cleanNum(item.f2);
      
      if(code==='USDCNH'&&price>5&&price<10){
        usRate=price;
      }
      if(code==='HKDCNH'&&price>0.5&&price<1.5){
        hkRate=price;
      }
      /* 也查找在岸汇率作为备选 */
      if(code==='USDCNYC'&&usRate===0&&price>5&&price<10){
        usRate=price;
      }
      if(code==='HKDCNYC'&&hkRate===0&&price>0.5&&price<1.5){
        hkRate=price;
      }
    }
    
    if(usRate>0&&hkRate>0){
      log('实时汇率获取成功: USD/CNY='+usRate.toFixed(4)+', HKD/CNY='+hkRate.toFixed(4));
    }else{
      log('部分汇率未找到，USDCNH='+usRate+', HKDCNH='+hkRate+'，外汇列表共'+list.length+'条',true);
      /* 如果只获取到部分，使用默认值补充 */
      if(usRate===0)usRate=defaultUs;
      if(hkRate===0)hkRate=defaultHk;
      isDefault=true;
    }
  }catch(e){
    log('实时汇率获取失败('+e.message+')，使用默认值: USD='+defaultUs+', HKD='+defaultHk,true);
    usRate=defaultUs;hkRate=defaultHk;isDefault=true;
  }
  
  /* 更新页面汇率显示 */
  $('rateUsd').textContent=usRate.toFixed(4)+(isDefault?'(默认)':'');
  $('rateHkd').textContent=hkRate.toFixed(4)+(isDefault?'(默认)':'');
  $('rateTime').textContent='更新于 '+new Date().toLocaleTimeString('zh-CN');
  
  return {usRate,hkRate};
}

/* ================= ① 行情：分页拉取（含退市股过滤） ================= */
async function fetchSpot(onPage){
  const mkPath=(pn,pz)=>'/api/qt/clist/get?pn='+pn+'&pz='+pz+'&po=1&np=1'+
    '&ut=bd1d9ddb04089700cf9c27f6f7426281&fltt=2&invt=2&fid=f12'+
    '&fs=m:0+t:6,m:0+t:80,m:1+t:2,m:1+t:23,m:0+t:81+s:2048,m:0+t:7,m:1+t:3'+
    '&fields=f2,f12,f13,f14,f20,f23';
  const ext=r=>{const raw=(r&&r.data&&r.data.diff)||[];return Array.isArray(raw)?raw:Object.values(raw);};
  const all=[];let pn=1;
  let skipped=0;
  while(true){
    const r=await jsonpPush2(mkPath(pn,100));
    const list=ext(r);
    if(!list.length)break;
    list.forEach(item=>{
      const price=item.f2;
      if(price===null||price===undefined||price==='-'||cleanNum(price)===0){
        skipped++;
        return;
      }
      all.push(item);
    });
    onPage&&onPage(all.length);
    if(list.length<100)break;
    pn++;
    if(pn>80)break;
    await sleep(300);
  }
  if(skipped>0)log('   已过滤退市/停牌股 '+skipped+' 只');
  return all;
}

/* ================= ② F10 资产负债表 ================= */
async function fetchF10Batch(reportDate){
  const out=[];let page=1;
  while(true){
    const url='https://datacenter-web.eastmoney.com/api/data/v1/get?'+
      'reportName=RPT_F10_FINANCE_GBALANCE&columns=ALL'+
      '&filter=(REPORT_DATE%3D%27'+reportDate+'%27)'+
      '&sortColumns=SECURITY_CODE&sortTypes=1&pageSize=500&pageNumber='+page;
    const r=await jsonpDC(url);
    const d=r&&r.result&&r.result.data;
    if(!d||!d.length)break;
    out.push(...d);
    if(out.length>=(r.result.count||0))break;
    page++;if(page>40)break;
    await sleep(200);
  }
  return out;
}

async function fetchBalanceFull(secuCode){
  const url='https://datacenter-web.eastmoney.com/api/data/v1/get?'+
    'reportName=RPT_F10_FINANCE_GBALANCE&columns=ALL'+
    '&filter=(SECUCODE%3D%22'+secuCode+'%22)'+
    '&sortColumns=REPORT_DATE&sortTypes=-1&pageSize=10&pageNumber=1';
  const r=await jsonpDC(url);
  const d=r&&r.result&&r.result.data;
  if(!d||!d.length)return null;
  const latest=String(d[0].REPORT_DATE).slice(0,10);
  let best=null;
  d.forEach(x=>{
    if(String(x.REPORT_DATE).slice(0,10)===latest){
      if(!best||cleanNum(x.TOTAL_ASSETS)>cleanNum(best.TOTAL_ASSETS))best=x;
    }
  });
  return best||d[0];
}

function recentReportDates(n){
  const arr=[];const now=new Date();const y=now.getFullYear();
  const qs=[[y,12,31],[y,9,30],[y,6,30],[y,3,31],[y-1,12,31],[y-1,9,30],[y-1,6,30],[y-1,3,31]];
  for(const[yy,mm,dd]of qs){
    const dt=new Date(yy,mm-1,dd);
    if(dt<now){arr.push(yy+'-'+String(mm).padStart(2,'0')+'-'+String(dd).padStart(2,'0'));if(arr.length>=n)break;}
  }
  return arr;
}

/* ================= NCAV 统一计算 ================= */
function calcRow(code,name,mv,f,rd,isB,currency){
  const ca=cleanNum(f.TOTAL_CURRENT_ASSETS);
  const liab=cleanNum(f.TOTAL_LIABILITIES);
  const mi=cleanNum(f.MINORITY_EQUITY);
  /* 新增：其他权益工具（永续债/优先股，类债属性，从NCAV中扣除）*/
  const oei=cleanNum(f.OTHER_EQUITY_TOOL||f.OTHER_EQUITY_INSTRUMENT||0);
  const ncav=ca-liab-mi-oei;
  if(!(ncav>mv))return null;
  const ib=cleanNum(f.SHORT_LOAN)
    +cleanNum(f.NONCURRENT_LIAB_1YEAR||f.NON_CURRENT_LIAB_1YEAR||f.LIAB_1YEAR||0)
    +cleanNum(f.LONG_LOAN)+cleanNum(f.BOND_PAYABLE);
  const ta=cleanNum(f.TOTAL_ASSETS);
  let marketLabel='A股';
  if(isB){
    marketLabel='B股('+currency+')';
  }
  return {code:code,name:name,rd:rd,
    market:marketLabel,
    ca:yi(ca),liab:yi(liab),ncav:yi(ncav),ib:yi(ib),mi:yi(mi),oei:yi(oei),
    ratio:ta>0?(liab/ta*100):null,mv:yi(mv),ratioNcav:mv/ncav};
}

/* ================= 主流程 ================= */
async function run(){
  $('btnRefresh').disabled=true;$('tbody').innerHTML='';setProg(0);
  log('开始刷新…');
  try{
    /* ① 并行拉取行情和汇率 */
    log('① 分页拉取全市场行情与实时汇率（外汇列表接口）…');
    const [spot,rates]=await Promise.all([fetchSpot(n=>setProg(Math.min(10,n/5700*10))), fetchExchangeRate()]);
    const {usRate,hkRate}=rates;
    
    if(spot.length<1000)throw new Error('行情仅获取 '+spot.length+' 条，接口异常');
    $('sTotal').textContent=spot.length;

    /* ② 粗筛：A股用PB<1，B股全量纳入并换算人民币市值 */
    const candA=[];
    const candB=[];
    const spotMap={};
    let bCount=0;
    let invalidMv=0;
    
    spot.forEach(s=>{
      const code=s.f12;
      const pb=cleanNum(s.f23);
      let mv=cleanNum(s.f20);
      const isB=isBShare(code);
      let currency='CNY';
      
      if(mv<=0){
        invalidMv++;
        return;
      }
      
      if(isB){
        bCount++;
        if(code.startsWith('200')){
          mv=mv*hkRate;
          currency='HKD';
        }else if(code.startsWith('900')){
          mv=mv*usRate;
          currency='USD';
        }
        spotMap[code]={code:s.f12,mkt:s.f13,name:s.f14,mv:mv,pb:pb,isB:true,currency:currency};
        candB.push(spotMap[code]);
      }else{
        spotMap[code]={code:s.f12,mkt:s.f13,name:s.f14,mv:mv,pb:pb,isB:false,currency:'CNY'};
        if(pb>0&&pb<1&&mv>0)candA.push(spotMap[code]);
      }
    });
    
    if(invalidMv>0)log('   额外过滤市值异常(≤0)股票 '+invalidMv+' 只');
    $('sBTotal').textContent=bCount;
    log('   有效行情共 '+spot.length+' 条 (A股 '+(spot.length-bCount)+', B股 '+bCount+')');
    const cand=[...candA,...candB];
    $('sCand').textContent=cand.length;
    log('② 粗筛候选: A股破净 '+candA.length+' 只, B股全量 '+candB.length+' 只 (B股已按实时汇率换算人民币)');
    setProg(15);

    /* ③ F10 批量：最近3个报告期 */
    const dates=recentReportDates(3);
    log('③ 批量拉取 F10 资产负债表，报告期: '+dates.join(' / '));
    const balMap={};
    for(let di=0;di<dates.length;di++){
      const rows=await fetchF10Batch(dates[di]);
      log('   '+dates[di]+' 批量返回 '+rows.length+' 条');
      rows.forEach(r=>{
        const c=r.SECURITY_CODE;if(!c)return;
        const rd=String(r.REPORT_DATE).slice(0,10);
        if(!balMap[c]){balMap[c]={rd:rd,row:r};}
        else if(rd>balMap[c].rd){balMap[c]={rd:rd,row:r};}
        else if(rd===balMap[c].rd){
          if(cleanNum(r.TOTAL_ASSETS)>cleanNum(balMap[c].row.TOTAL_ASSETS))balMap[c]={rd:rd,row:r};
        }
      });
      setProg(15+40*(di+1)/dates.length);
    }
    $('sCover').textContent=Object.keys(balMap).length;

    /* ④ 单股兜底 */
    const missingCands=[];
    cand.forEach(c=>{
      if(!balMap[c.code])missingCands.push(c);
    });
    if(missingCands.length>0){
      log('④ 发现 '+missingCands.length+' 只候选股批量数据缺失，启动单股兜底: '+
        missingCands.slice(0,5).map(c=>c.name+'('+c.code+')').join('、')+(missingCands.length>5?'…':''));
      const tasks=missingCands.map(c=>async()=>{
        try{
          const full=await fetchBalanceFull(codeOf(c.code,c.mkt));
          return full?{c:c,full:full}:null;
        }catch(e){return null;}
      });
      const filled=(await pool(tasks,6,(d,t)=>setProg(55+20*d/t))).filter(Boolean);
      filled.forEach(x=>{
        balMap[x.c.code]={rd:String(x.full.REPORT_DATE).slice(0,10),row:x.full};
      });
      log('   单股兜底补齐 '+filled.length+' 只');
    }
    setProg(78);

    /* ⑤ 计算NCAV */
    const result=[];
    cand.forEach(c=>{
      const b=balMap[c.code];if(!b)return;
      const row=calcRow(c.code,c.name,c.mv,b.row,b.rd,c.isB,c.currency);
      if(row)result.push(row);
    });

    const pab=balMap['000001'];
    if(pab)log('单位自检: 平安银行总资产原始值 = '+pab.row.TOTAL_ASSETS+'（正常应约5e12量级）');
    if(pab)log('字段自检: 平安银行其他权益工具 = '+pab.row.OTHER_EQUITY_TOOL+'（无永续债/优先股则为0或null）');

    result.sort((a,b)=>a.ratioNcav-b.ratioNcav);
    $('sFinal').textContent=result.length;
    render(result);
    log('完成，入选 '+result.length+' 只（含A股与换算后B股，已排除退市股）。');
    safeStorage.setItem('ncav_cache',JSON.stringify({ts:Date.now(),data:result,rates:{us:usRate,hk:hkRate}}));
  }catch(e){
    log('刷新失败: '+e.message,true);
  }
  $('btnRefresh').disabled=false;setProg(100);scheduleNext();
}
function setProg(p){$('pgBar').style.width=Math.min(100,p)+'%';}

/* ================= 渲染 ================= */
function render(rows){
  const cols=[['代码','code'],['市场','market'],['名称','name'],['报告期','rd'],['流动资产合计(亿)','ca'],['负债合计(亿)','liab'],
    ['NCAV(亿)','ncav'],['有息负债(亿)','ib'],['少数股东权益(亿)','mi'],['其他权益工具(亿)','oei'],['资产负债率(%)','ratio'],
    ['总市值(亿,CNY)','mv'],['市值/NCAV','ratioNcav']];
  $('thead').innerHTML='<tr>'+cols.map(c=>'<th>'+c[0]+'</th>').join('')+'</tr>';
  $('tbody').innerHTML=rows.length?rows.map(r=>'<tr>'+
    cols.map(c=>{const v=r[c[1]];
      let s;
      if(v==null)s='<span class="num-null">—</span>';
      else if(typeof v==='number')s=v.toFixed(2);
      else s=v;
      if(c[1]==='ratioNcav'&&v!=null)s='<span class="tag-low">'+v.toFixed(3)+'</span>';
      if(c[1]==='market'&&v&&v.startsWith('B股'))s='<span class="tag-b">'+v+'</span>';
      return '<td>'+s+'</td>';}).join('')+'</tr>').join('')
    :'<tr><td colspan="13" style="text-align:center;color:#4a5568;padding:24px">当前无满足 NCAV &gt; 市值 的股票</td></tr>';
}

/* ================= 定时 ================= */
let _timer=null;
function scheduleNext(){
  clearTimeout(_timer);
  const now=new Date(),t=new Date(now);
  t.setHours(18,0,0,0);
  if(t<=now)t.setDate(t.getDate()+1);
  $('sNext').textContent=t.toLocaleString('zh-CN');
  _timer=setTimeout(run,t-now);
  log('已调度下次自动刷新: '+t.toLocaleString('zh-CN'));
}
setInterval(()=>{
  if(!document.hidden){
    const n=new Date(),t=new Date();t.setHours(18,0,0,0);
    if(Math.abs(t-n)<60000&&!$('btnRefresh').disabled){log('18:00 触发自动刷新');run();}
  }
},60000);

/* ================= 启动 ================= */
$('btnRefresh').onclick=run;
(function init(){
  const c=safeStorage.getItem('ncav_cache');
  if(c){
    try{
      const o=JSON.parse(c);
      render(o.data);
      if(o.rates){
        $('rateUsd').textContent=o.rates.us.toFixed(4)+'(缓存)';
        $('rateHkd').textContent=o.rates.hk.toFixed(4)+'(缓存)';
        $('rateTime').textContent='缓存于 '+new Date(o.ts).toLocaleTimeString('zh-CN');
      }
      log('已加载 '+new Date(o.ts).toLocaleString('zh-CN')+' 的缓存，点击刷新获取最新');
    }catch(e){}
  }
  scheduleNext();
  if(!c)run();
})();
</script>
